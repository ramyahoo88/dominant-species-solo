:root{
  --bg:#eeeee6;--paper:#f9f9f2;--ink:#182e30;--muted:#4e6464;--line:#d6ded3;
  --dark:#163b3b;--teal:#215750;--pale:#e4ece5;--warm:#eee1c9;--focus:#8a4c28;
  --serif:"Instrument Serif",Georgia,serif;--body:"DM Sans",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{min-width:300px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--teal);text-underline-offset:.19em}
button,input,select{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #ac673c;outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:30px}
.skip{position:fixed;left:16px;top:10px;background:var(--paper);padding:10px;z-index:5;transform:translateY(-200%)}
.skip:focus{transform:none}
.mast{background:var(--dark);color:#fff}
.mast-inner{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:#f1f4ea;font-size:16px;font-weight:700;letter-spacing:.015em}
.emblem{width:31px;height:31px;border:1px solid #8ab3a2;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:2px}
.emblem i{width:3px;height:12px;background:#b4d6c8;transform:skew(-23deg);display:block}
.emblem i:first-child{height:7px;margin-top:5px}.emblem i:last-child{height:17px;margin-top:-5px}
nav{display:flex;align-items:center;gap:4px}
nav button{color:#eff5ec;background:transparent;border:0;padding:10px 12px;border-radius:7px;font-size:14px;white-space:nowrap}
nav button:hover{background:#ffffff1c}
h1,h2,h3,p{margin:0}
h1,h2,.display{font-family:var(--serif);font-weight:400;line-height:1}
h2{font-size:clamp(32px,4vw,45px)}
h3{font-size:17px;line-height:1.25}
small,.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:307px;margin:30px 0 21px;border-radius:16px;

.hero::after{background:linear-gradient(90deg,#143a39 0%,#143a39 31%,#193e3dec 43%,#193e3d2f 72%,#193e3d0a 100%)}
.hero-copy{padding:37px 42px;max-width:580px}
.hero .eyebrow{color:#c7ddcd;margin-bottom:12px}
.hero h1{font-size:clamp(56px,8.4vw,104px);letter-spacing:-.035em;white-space:normal;margin-bottom:12px}
.hero p:last-child{font-size:17px;color:#eff4e8;max-width:360px}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 5px 20px #12363108}
.setup-panel{padding:26px 30px 29px}
.setup-title{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-bottom:18px}
.setup-title h2{font-size:40px}
.setup-title p{color:var(--muted);font-size:14px}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seat{background:#eff1e9;border:1px solid #d8ded4;border-radius:10px;padding:13px 14px 12px;min-width:0}
.seat.human{background:#e5eeeb;border-color:#b8cec3}
.seat .seat-role{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:var(--muted)}
.seat-head{display:flex;gap:8px;align-items:center}
.seat-head select{min-width:0}
.seat p{font-size:12px;color:var(--muted);min-height:35px;margin-top:7px}
.seat-hint{font-size:12px;color:var(--muted);margin-top:8px}
.mark{--chip:#e3eae0;--chip-ink:#263333;width:29px;height:29px;flex:0 0 29px;display:inline-grid;place-items:center;border:1px solid #193c3b26;
  border-radius:8px;background:var(--chip);color:var(--chip-ink);font-size:11px;font-weight:700;line-height:1}
.mark.tiny{width:22px;height:22px;flex-basis:22px;border-radius:5px;font-size:10px}
.setup-bottom{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
fieldset{padding:0;margin:0;border:0;min-width:0}
legend{font-size:13px;font-weight:700;margin-bottom:6px;padding:0}
.segment{display:flex;gap:5px;flex-wrap:wrap}
.segment label{display:flex;gap:7px;align-items:center;cursor:pointer;border-radius:7px;padding:8px 11px;border:1px solid var(--line);font-size:13px;background:#fffdf8}
.segment label:has(:checked){border-color:#6b9181;background:#e6eee4}
input[type="radio"],input[type="checkbox"]{accent-color:var(--teal);width:16px;height:16px;margin:0;vertical-align:middle}
input[type=number],select{padding:8px 9px;border-radius:7px;border:1px solid #bdcbc2;background:#fffef8;color:var(--ink);min-height:41px}
select{width:100%;text-overflow:ellipsis}
select:disabled{background:#e8ebe2;color:#485b55}
input[type=number]{max-width:90px;width:100%}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 15px;border:1px solid #bdccc0;border-radius:8px;background:#f4f6ec;
  font-weight:700;line-height:1.2;text-decoration:none;white-space:normal;text-align:center}
.button:hover{background:#e5ede2}.button.primary{background:var(--teal);border-color:var(--teal);color:#fff}.button.primary:hover{background:#163f39}
.button:disabled{opacity:.47}.button.subtle{background:transparent}
.button.sm{min-height:34px;padding:6px 10px;font-size:13px}
.footer{font-size:12px;color:#4a5f5d;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:64px;flex-wrap:wrap}
.notice{padding:10px 12px;margin:12px 0;border-radius:8px;background:#f5e7d9;color:#652c22;border:1px solid #e0b9a4;font-size:14px}
.game-top{margin:25px 0 15px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.game-top .eyebrow{color:var(--muted);margin-bottom:5px}
.game-top h1{font-size:51px}
.game-top .toolrow{display:flex;gap:6px}
.score-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}
.score-box{background:#f9f9f1;border:1px solid var(--line);border-radius:10px;min-width:0;padding:10px 12px;display:flex;align-items:center;gap:8px}
.score-box .score-side{flex:1;min-width:0}
.score-side strong,.score-side small{display:block;line-height:1.35}
.score-side strong{font-size:14px;overflow-wrap:anywhere}
.score-side small{font-size:11px}
.score-vp{text-align:right;line-height:1.18;white-space:nowrap;font-size:11px;color:var(--muted)}
.score-vp b{font-size:20px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.game-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:start;gap:14px}
.column{display:grid;gap:13px;min-width:0}
.block{padding:17px 19px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.block-head h2{font-size:34px}
.block-head h3{font-weight:700}
.block-head .muted{font-size:12px}
.phase-badge{background:#dce9de;color:#26483f;border-radius:100px;padding:4px 9px;font-size:12px;white-space:nowrap}
.lead{color:var(--muted);font-size:14px}
.instruction{margin:8px 0 14px;font-size:15px}
.actorline{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:700}
.current-card{margin:10px 0 13px;border:1px solid #b9cec3;border-left:4px solid var(--teal);border-radius:9px;background:#e9f0e8;padding:11px 13px}
.current-card .eyebrow{color:#476459;font-size:10px;margin-bottom:3px}
.current-card .display{font-size:29px}
.current-card .muted{font-size:13px;margin-top:4px}
.result-box{border-radius:8px;padding:11px 13px;background:#ecf0e4;border:1px solid #d3dfd0;margin:10px 0 13px}
.result-box strong{display:block}
.result-box p{margin-top:3px;font-size:13px}
.current-card .card-flow,.card-flow{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:8px;font-size:12px}
.card-flow span{padding:3px 7px;border-radius:5px;background:#f9faf1;border:1px solid #d0dcd0}
.turn-form label.form-field{display:block;min-width:0}
.field-title{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.turn-form .fields{display:grid;gap:9px;margin:9px 0 12px}
.turn-form .fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields .wide{grid-column:1/-1}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.draw-instruction{margin:0 0 11px;color:var(--muted);font-size:13px}
.draw-field{margin-bottom:13px}
.draw-field legend span{color:var(--muted);font-weight:400;margin-left:7px}
.draw-choices,.draw-order{display:grid;gap:5px}
.draw-choices{grid-template-columns:repeat(3,minmax(0,1fr))}
.draw-order{grid-template-columns:repeat(4,44px);margin-top:6px}
.button.disk-pick,.button.disk-remove{min-height:44px;background:var(--disk);border-color:#7f8c7e;padding:6px 4px;color:#24352d;font-size:13px}
.button.disk-pick:hover,.button.disk-remove:hover{filter:brightness(.95)}
.empty-disk{display:grid;place-items:center;min-height:44px;border:1px dashed #bdccc0;border-radius:8px;color:var(--muted)}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.checked{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
.checked input{flex-shrink:0}
.move-line{display:flex;align-items:center;gap:7px;justify-content:space-between;border-bottom:1px solid var(--line);font-size:13px;padding:4px 0}
.board-panel{padding:14px 16px}
.board-panel .block-head{margin-bottom:5px}
.earth{position:relative;isolation:isolate;aspect-ratio:1.12;margin:4px 0;background:radial-gradient(ellipse at center,#e9eee3,#f9f9f2 72%);overflow:hidden}
.hex{position:absolute;left:var(--x);top:var(--y);width:16.67%;height:14.29%;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;isolation:isolate}
.hex::before,.hex::after{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(100% 50%,75% 100%,25% 100%,0% 50%,25% 0%,75% 0%)}
.hex::before{background:#b9c6b8}
.hex::after{background:var(--terrain,#f1f2e9);inset:2px}
.hex.empty::after{background:#f6f6ed}
.hex[aria-pressed=true]::before,.hex:hover::before{background:#286356}
.hex[aria-pressed=true]::after{inset:4px}
.hex:focus-visible{outline-offset:-3px;z-index:3}
.hex-inner{display:flex;align-items:center;flex-direction:column;justify-content:center;height:100%;font-size:10px;line-height:1.04}
.hex-id{font-weight:700;font-size:10px;color:#243c3c}
.hex-terrain{font-size:8px;line-height:1.1;margin-top:3px;color:#273c33}
.hex.empty .hex-id{color:#667a72}
.hex-tokens{display:flex;gap:2px;margin-top:3px}
.hex-token{background:var(--chip);color:var(--chip-ink);border:1px solid #18363035;border-radius:3px;padding:2px 2px;font-size:9px;font-weight:700;line-height:1}
.hex-token.endangered{border-color:#a93827;text-decoration:underline;text-decoration-color:#a93827}
.cone-marker{position:absolute;right:23%;top:10%;font-size:7px;line-height:1;border-radius:3px;padding:2px 3px;background:var(--chip);color:var(--chip-ink);border:1px solid #355d56;display:none}
.cone-marker::before{content:"▲ ";font-size:6px}
.map-help{display:flex;justify-content:space-between;flex-wrap:wrap;gap:3px 10px;margin-top:9px;font-size:10px;color:var(--muted)}
.game-jump{display:none}
.element-dot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);pointer-events:none;z-index:1;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;border:1px solid #36534c71;background:var(--chip);color:#233b38;font-size:8px;font-weight:700}
.tile-detail{min-height:66px;padding:9px 0 1px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.tile-detail b{color:var(--ink)}
.element-list{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.element-chip{font-size:11px;color:#264039;background:var(--chip,#e9ede2);border-radius:5px;padding:3px 6px}
.row-board{display:grid;gap:4px}
.action-row{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #e4e8de}
.action-row:last-child{border-bottom:0}
.row-name{font-size:12px;font-weight:700}
.slots{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.slot{border:1px solid #c9d4c7;background:#f1f3e9;min-width:29px;min-height:31px;border-radius:6px;font-size:10px;padding:2px 4px;display:inline-flex;align-items:center;justify-content:center;gap:2px;font-weight:700}
.slot:not(:disabled):hover,.slot.target{border-color:#3a7a65;box-shadow:0 0 0 1px #3a7a65;background:#e2eee3}
.slot.pawn{background:var(--chip);color:var(--chip-ink);border-color:#456b566b}
.slot small{font-size:9px;color:inherit}
.row-status{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}
.row-status span{border-radius:4px;background:#e9eee5;padding:3px 5px}
.market{display:flex;gap:5px;flex-wrap:wrap;font-size:12px}
.market span{padding:4px 7px;background:#eef1e7;border:1px solid #dce4d9;border-radius:5px}
.market span.ice{background:#d8ebee;border-color:#a8c8cd}
.log-panel summary{cursor:pointer;font-weight:700}
.log-list{list-style:none;margin:10px 0 0;padding:0;max-height:365px;overflow:auto}
.log-list li{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.log-list b{display:block}
.log-list small{font-size:11px}
.log-list p{color:var(--muted)}
dialog{width:min(840px,calc(100% - 28px));max-height:calc(100dvh - 40px);border:1px solid #b5c5b9;border-radius:14px;background:var(--paper);color:var(--ink);padding:0;box-shadow:0 18px 70px #0e2d2c65}
dialog::backdrop{background:#132d2c88}
.modal-header{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal-header h2{font-size:36px}
.modal-body{padding:15px 20px 22px}
.modal-body h3{margin-top:12px}
.modal-body p,.modal-body ol{margin-top:6px}
.deck-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.deck-tabs button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.deck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.deck-card{background:#edf1e8;padding:11px 12px;border:1px solid #d6e0d4;border-radius:8px}
.deck-card h3{margin:0}
.deck-card p{font-size:13px}
.deck-card details{margin-top:8px;font-size:13px}
.deck-card summary{cursor:pointer;font-weight:700}
.stack-actions{display:grid;gap:8px;max-width:340px;margin-top:12px}
@media(max-width:820px){
  .wrap{padding-inline:18px}.game-grid{grid-template-columns:minmax(0,1fr) minmax(0,.9fr)}
  .block{padding:14px}.board-panel{padding:11px}.action-row{grid-template-columns:96px minmax(0,1fr)}
}
@media(max-width:670px){
  .wrap{padding-inline:12px}.mast-inner{min-height:55px;gap:3px}.brand{font-size:13px;gap:6px}.emblem{width:25px;height:25px}
  nav{gap:0}nav button{padding:8px 6px;font-size:12px}.hero{margin:15px 0 12px;min-height:232px}
  .hero-copy{padding:28px 18px;max-width:100%}.hero h1{font-size:clamp(50px,11.5vw,77px)}.hero p:last-child{font-size:15px;max-width:275px}
  .hero::before{background-size:90% auto}.hero::after{background:linear-gradient(90deg,#143a39 0%,#143a39ed 34%,#193e3dc0 63%,#193e3d27)}
  .setup-panel{padding:18px 14px}.setup-title h2{font-size:35px}.setup-title{margin-bottom:12px}
  .seats{grid-template-columns:1fr;gap:6px}.seat{padding:8px 9px}.seat .seat-role{margin-bottom:3px}
  .seat p{min-height:0;margin:4px 0 0}.seat select{min-height:38px}.setup-bottom{margin-top:13px;gap:13px}
  .setup-bottom .button.primary{flex:1}.game-top{margin:17px 0 10px}.game-top h1{font-size:40px}
  .score-strip{gap:5px;margin-bottom:9px}.score-box{padding:6px 5px;gap:4px}.score-box>.mark{width:21px;height:21px;flex-basis:21px;border-radius:5px;font-size:9px}
  .score-side strong{font-size:11px}.score-side small{font-size:9px}.score-vp b{font-size:15px}.score-vp{font-size:9px}
  .score-box{display:grid;grid-template-columns:auto 1fr;align-items:center}.score-box .score-side{grid-row:2;grid-column:1/-1}.score-vp{grid-row:1;grid-column:2}
  .game-grid{grid-template-columns:1fr;gap:8px}.column{gap:8px}.block-head h2{font-size:31px}
  .game-jump{display:flex;gap:12px;margin:0 2px 9px;font-size:12px}
  .block{padding:13px}.earth{max-width:540px;margin-inline:auto}.footer{min-height:53px}
  .hex-terrain{font-size:7px}.element-dot{width:17px;height:17px}.modal-body{padding:12px 14px 17px}.modal-header{padding:12px 14px}
}
@media(min-width:730px){.cone-marker{display:block}}
@media(max-width:365px){
  .mark.tiny{width:18px;height:18px;flex-basis:18px}.deck-grid{grid-template-columns:1fr}
  nav button{font-size:11px;padding-inline:5px}.brand{font-size:12px}.button.sm{font-size:12px}
}
@media print{
  body{background:white;color:black}.mast,.footer,main{display:none}
  dialog[open]{position:static;border:0;box-shadow:none;width:100%;max-height:none;overflow:visible}
  dialog::backdrop,.modal-header button,.deck-tabs{display:none}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

  const same = main.querySelector('[data-row="' + row + '"][data-element="' + (element ?? '') + '"]:not(:disabled)');
  const next = main.querySelector('[data-row="' + row + '"][data-do="add-disk"]:not(:disabled)') ??
    main.querySelector('[data-row="' + row + '"][data-do="remove-disk"]');
  (same ?? next)?.focus({preventScroll:true});
}
function openModal(kind) {
  modalKind=kind;
  renderModal();
  if (!modal.open) modal.showModal();
  else modal.querySelector('[data-do="close"]')?.focus();
}
function renderModal() {
  const titles={help:'How to play',decks:'Bot decks',menu:'Game menu',new:'Start a new game?'};
  let content='';
  if (modalKind === 'help') content =
    '<p>Use your physical copy of Chad Jensen’s original GMT game. Set up one animal for yourself and two rivals with the normal three-player allotment of 6 pawns and 50 cubes per animal, including its VP marker. Use the standard starting map shown in the app.</p>' +
    '<ol><li>Enter the actual elements, tile stack faces and Dominance Cards when the app requests them. Keep the official cards and tiles at your table.</li>' +
    '<li>Place your own pawns. Reveal a card for each rival placement and mirror the indicated slot on your action display.</li>' +
    '<li>Apply each action to the physical board and confirm it here. The Earth map uses the starting wetland as north. Corner 1 points right, and corners 2–6 follow clockwise. The map shows a shared corner once.</li>' +
    '<li>Follow the app’s Extinction and Survival prompts. After Ice Age, complete the turn and compare the final scores.</li></ol>' +
    '<h3>Bot cards</h3><p>Each rival shuffles its own eight-card deck, checks one condition per placement and starts on the corresponding face. The action list guides the pawn placement. The bot can take another open space when it sees a stronger opportunity. Targets are chosen when the pawn resolves.</p>' +
    '<h3>Board tracking</h3><p>The companion checks cones automatically. When a protected Hibernation cube shares a tile with other cubes of the same animal, the app moves or removes the ordinary cubes first. Confirm each physical move to save it. Undo is available until you close or reload the page. Export a save before switching browsers or devices.</p>' +
    '<p><a href="'+RULEBOOK+'" target="_blank" rel="noopener noreferrer">GMT rulebook</a> · <a href="'+PHOTO+'" target="_blank" rel="noopener noreferrer">Portage Glacier photo, USGS</a></p>';
  if (modalKind === 'decks') content='<div class="deck-tabs" role="group" aria-label="Animal deck">' + FOOD.map(id=>button(nameOf(id),'deck-tab','sm',
    'data-animal="'+id+'" aria-pressed="'+(id===deckTab)+'"')).join('') + '</div><p class="actorline">' + badge(deckTab) + ANIMALS[deckTab].power + '</p>' +
    '<div class="deck-grid">' + DECKS[deckTab].map(card=>'<article class="deck-card"><h3>'+card.title+'</h3><p>'+CHECKS[card.check]+'?</p>' +
    '<details><summary>Yes · '+FOCUSES[card.yes.focus]+'</summary>'+cardRows(card.yes)+'</details>' +
    '<details><summary>No · '+FOCUSES[card.no.focus]+'</summary>'+cardRows(card.no)+'</details></article>').join('') + '</div>';
  if (modalKind === 'menu') content='<div class="stack-actions">' + button('Export save','export') + button('Import save','import') + button('Start a new game','new','subtle') + '</div>';
  if (modalKind === 'new') content='<p>This replaces the current game on this device. Export it first if you want to return to it.</p><div class="form-actions">' +
    button('Start new game','new-confirm','primary') + button('Export current save','export','subtle') + '</div>';
  modal.innerHTML='<div class="modal-header"><h2 id="modal-heading">'+titles[modalKind]+'</h2>' +
    button('Close','close','sm subtle','autofocus') + '</div><div class="modal-body">'+content+'</div>';
}
function exportSave() {
  if (!game) return;
  const body=saveContents();
  const url=URL.createObjectURL(new Blob([body],{type:'application/json'}));
  const a=document.createElement('a');
  a.href=url; a.download='Dominant_Species_Turn_'+game.turn+'.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importSave(file) {
  if (!file) return;
  try {
    if (file.size > 1_500_000) throw new Error('That file is too large for a companion save.');
    const parsed=JSON.parse(await file.text());
    if (parsed.format !== SAVE_KEY) throw new Error('Choose a save exported by this companion.');
    const loaded=validateState(parsed.game);
    if (game) undo=[copy(game)]; else undo=[];
    game=loaded; activeTile='D3'; reveal=null; preview=null; draft=readSupplyDraft(loaded,parsed.supply); notice=''; initialError='';
    if (modal.open) modal.close();
    save(); render(true);
  } catch (err) {
    if (modal.open) modal.close();
    fail(err instanceof SyntaxError ? 'This file does not contain a readable JSON save.' : err.message);
  }
}
document.getElementById('import-file').addEventListener('change',event => {
  const file=event.target.files[0];
  event.target.value='';
  void importSave(file);
});
document.addEventListener('click',event => {
  const btn=event.target.closest('button[data-do]');
  if (!btn || btn.disabled) return;
  try {
    switch (btn.dataset.do) {
      case 'decks': case 'help': case 'menu': openModal(btn.dataset.do); break;
      case 'close': modal.close(); break;
      case 'deck-tab':
        deckTab=btn.dataset.animal; renderModal(); modal.querySelector('[data-animal="'+deckTab+'"]')?.focus(); break;
      case 'new': openModal('new'); break;
      case 'new-confirm':
        setup={human:game.human,bot1:game.rivals[0],bot2:game.rivals[1],short:game.short};
        game=null; undo=[]; reveal=null; preview=null; draft={}; notice=''; initialError='';
        modal.close(); save(); render(false);
        main.focus();
        break;
      case 'export': exportSave(); break;
      case 'import': document.getElementById('import-file').click(); break;
      case 'tile':
        activeTile=btn.dataset.tile;
        render(false);
        main.querySelector('.hex[data-tile="'+activeTile+'"]')?.focus({preventScroll:true});
        break;
      case 'place':
        if (game.phase==='planning' && currentPlanner(game)?.actor===game.human && !reveal) edit(s=>place(s,btn.dataset.slot));
        break;
      case 'draw': {
        const actor=currentPlanner(game)?.actor;
        if (actor && isBot(game,actor)) {
          reveal={...botPlacement(copy(game)),actor}; notice=''; render(true,true);
        }
        break;
      }
      case 'next':
        if (reveal) edit(s=>botPlacement(s));
        break;
      case 'preview': executionPreview(); break;
      case 'cancel-preview': preview=null; notice=''; render(true,true); break;
      case 'apply':
        if (preview) edit(s=>runStep(s,nextStep(s),copy(preview)));
        break;
      case 'pass': {
        const step=nextStep(game);
        if (step.kind==='pawn' || step.kind==='insect' || step.kind==='spider') showChoicePreview(step,{...PASS});
        break;
      }
      case 'undo':
        if (reveal || preview) { reveal=null; preview=null; render(true,true); }
        else if (undo.length) {
          game=undo.pop(); reveal=null; preview=null; draft={}; notice='';
          save(); render(true,true);
        }
        break;
      case 'add-move': addMove(); break;
      case 'add-disk': case 'remove-disk': editSupplyDisks(btn); break;
      case 'remove-move':
        draft.moves.splice(Number(btn.dataset.index),1); render(false); break;
    }
  } catch(err) { fail(err.message); }
});
document.getElementById('version').textContent='v'+VERSION;
restore();
if (game) save();
render();
</script>
</body>
